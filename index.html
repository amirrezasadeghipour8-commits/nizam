<body>
  <header class="topbar">

      <span class="brand-mark" aria-hidden="true">ن</span>

    </a>
    <a href="#/settings" data-tab="settings">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>

  <div id="modal" class="modal" hidden></div>

  <script src="js/jalali.js"></script>
